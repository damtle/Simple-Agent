name: Repository checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        directory: ['.', 'code/chapter14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install this package in an isolated job
        working-directory: ${{ matrix.directory }}
        run: python -m pip install -c "${{ github.workspace }}/constraints.txt" -e ".[dev]"
      - name: Run deterministic tests
        working-directory: ${{ matrix.directory }}
        run: python -m pytest
      - name: Check book structure
        if: matrix.directory == '.'
        run: python scripts/check_docs.py
